# معرض الأشياء — CI Pipeline
# يعمل عند كل Push على الفروع الرئيسية وعند كل Pull Request.
# استراتيجية الاختبار: docs/TESTING_STRATEGY.md

name: "معرض الأشياء — CI"

on:
  push:
    branches: [main, develop, "launch/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # حارس الأسرار: يمنع عودة الأسرار الافتراضية المسرّبة
  # ─────────────────────────────────────────────
  secrets-guard:
    name: "Static checks — secrets, contracts, shared code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every web/mobile API call has a matching server route
        run: node scripts/check-contracts.mjs
      - name: Shared security/database helpers are identical in every service
        run: node scripts/check-shared-copies.mjs
      - name: Markets registry is valid and generated copies are in sync
        run: node packages/markets/build.mjs --check
      - name: Legal pages export (GitHub Pages copy) builds
        run: node scripts/build-legal-pages.mjs /tmp/legal-site
      - name: Helm chart lints and renders
        run: |
          docker run --rm -v "$PWD/infra/helm:/charts" alpine/helm:3.16.3 lint /charts/marad --strict
          docker run --rm -v "$PWD/infra/helm:/charts" alpine/helm:3.16.3 template demo /charts/marad > /dev/null
      - name: Fail on known leaked default secrets
        run: |
          pattern="your-secret-key|access_secret_key_12345|refresh_secret_key_67890|supersecretkey|marad-internal-secret-for-webhooks|secret123|dev-jwt-secret-change-in-production"
          if git grep -nE "$pattern" -- ':!*.spec.ts' ':!*test*' ':!docs/**' ':!.github/**'; then
            echo "::error::A known leaked default secret is back in the code"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # خدمات Node ضمن مساحة العمل (workspace) — فحص الأنواع + اختبارات الوحدة
  # ─────────────────────────────────────────────
  node-workspace:
    name: "Node — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - listings-service
          - search-service
          - messaging-service
          - transactions-service
          - identity-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (workspace root)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: services/${{ matrix.service }}
      - name: Lint (no warnings allowed)
        run: npm run lint
        working-directory: services/${{ matrix.service }}
      - name: Unit tests
        run: npx jest --ci
        working-directory: services/${{ matrix.service }}

  # خدمات لها ملف قفل خاص بها (خارج مساحة العمل)
  node-standalone:
    name: "Node — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [users-service, moderation-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --legacy-peer-deps
        working-directory: services/${{ matrix.service }}
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: services/${{ matrix.service }}
      - name: Lint (no warnings allowed)
        run: npm run lint
        working-directory: services/${{ matrix.service }}
      - name: Unit tests
        run: npx jest --ci
        working-directory: services/${{ matrix.service }}

  # ─────────────────────────────────────────────
  # اختبارات التكامل على Postgres و Redis حقيقيين
  # ─────────────────────────────────────────────
  integration:
    name: "Integration — Postgres + Redis"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marad
          POSTGRES_PASSWORD: marad
          POSTGRES_DB: marad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marad" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://marad:marad@localhost:5432/marad_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Migration runner tests
        run: npm ci --prefix db && node --test db/migrate.test.mjs
      - name: Apply all migrations to an empty database (twice — must be idempotent)
        run: node db/migrate.mjs && node db/migrate.mjs
      - name: Entities match the migrated schema (no drift)
        run: npx ts-node -P scripts/tsconfig.json scripts/check-entity-schema.ts
      - name: Admin dashboard aggregates run against the migrated schema
        run: |
          npm ci --legacy-peer-deps --prefix services/moderation-service
          npx ts-node -P scripts/tsconfig.json scripts/check-admin-stats.ts
      - name: auth-service (Redis atomicity, OTP brute force)
        run: npm run test:int
        working-directory: services/auth-service
      - name: listings-service (pagination, LIKE escaping, view sync)
        run: npm run test:int
        working-directory: services/listings-service
      - name: messaging-service (concurrent sends, keyset paging, read positions, query plans)
        run: npm run test:int
        working-directory: services/messaging-service
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: personalization-service (partitioned user_events, signals query, partition maintenance)
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests/test_db_integration.py
        working-directory: services/personalization-service
      - name: fraud-service (device/IP upserts, transaction log, index-only risk)
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests/test_db_integration.py
        working-directory: services/fraud-service

  # ─────────────────────────────────────────────
  # خدمات Python
  # ─────────────────────────────────────────────
  python:
    name: "Python — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [fraud-service, personalization-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: services/${{ matrix.service }}
      - name: Tests
        run: python -m pytest -q
        working-directory: services/${{ matrix.service }}

  # ─────────────────────────────────────────────
  # تطبيق Next.js
  # ─────────────────────────────────────────────
  web:
    name: "Next.js — Web App"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Design tokens are in sync and meet WCAG AA contrast
        run: node packages/design-tokens/build.mjs --check
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Lint (errors fail; warnings are tracked tech debt)
        run: npm run lint
        working-directory: apps/web
      - name: Unit tests
        run: npx jest --ci
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web

  # ─────────────────────────────────────────────
  # تطبيق Flutter
  # ─────────────────────────────────────────────
  flutter:
    name: "Flutter — Mobile App"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # device_info_plus ^13 (pubspec) needs Dart ≥ 3.10, first shipped in Flutter 3.38.
          flutter-version: "3.38.x"
          channel: stable
      - name: Bundled .env asset (pubspec lists it; the real one is never committed)
        run: cp .env.example .env
        working-directory: apps/mobile
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Analyze (infos and warnings fail the build)
        run: flutter analyze
        working-directory: apps/mobile
      - name: Tests
        run: flutter test
        working-directory: apps/mobile

  # ─────────────────────────────────────────────
  # Full stack in Docker: build every image, start everything, seed demo data and play
  # the end-to-end journey through the gateway (52 checks).
  # ─────────────────────────────────────────────
  e2e:
    name: "E2E — full stack in Docker"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Secrets and key pair for this run
        run: sh scripts/gen-env.sh
      - name: Build and start (waits for every health check)
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 600
      - run: npm ci
      - name: Demo data
        run: node scripts/seed-demo.mjs
      - name: End-to-end journey
        run: node scripts/e2e-smoke.mjs
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
