# Security scanning: static analysis (CodeQL), leaked secrets (gitleaks), vulnerable
# dependencies and Docker/IaC misconfigurations (Trivy). Runs on every push/PR and weekly,
# so newly published CVEs surface even when the code does not change.
name: "Security"

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: "CodeQL — ${{ matrix.language }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: "Secrets — gitleaks (full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned image; .gitleaks.toml / .gitleaksignore hold the reviewed false positives.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact -v

  trivy:
    name: "Dependencies & misconfig — Trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulnerable dependencies, Dockerfile/compose misconfigurations, secrets
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.2 fs
          --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed
          --skip-dirs '**/node_modules' --skip-dirs archive --skip-dirs apps/mobile
          --exit-code 1 /src

  npm-audit:
    name: "npm audit — production dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/users-service
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/moderation-service
