# gitleaks configuration: default rules plus reviewed false positives.
[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives (see docs/SECURITY_AUDIT.md, S13)"
paths = [
  # NestJS starter README: a placeholder CircleCI badge token (token=abc123def456).
  '''services/.+/README\.md''',
  # Firebase Android client config: the key ships inside every APK and is restricted
  # in Google Cloud Console instead (accepted risk S12 in docs/SECURITY_AUDIT.md).
  '''apps/mobile/android/app/google-services\.json''',
  # Local, git-ignored secrets file generated by scripts/gen-env.sh.
  '''infra/\.env$''',
]
