# Ma'rad Al-Ashya' — local stack. One command from the repo root:
#
#   make up            (generates infra/.env on first run, builds, starts, waits for health)
#   docker compose -f infra/docker-compose.yml up -d --build   (if infra/.env already exists)
#
# Secrets and credentials come from infra/.env (see infra/.env.example). There are
# deliberately no defaults for secrets: compose refuses to start without them.
#
# Only the public entry points are published on the host: the web app, the API gateway,
# the chat socket, and the observability UIs. Every service is reachable only through the
# gateway, exactly as in production.

name: marad

x-build-secrets: &build-secrets
  # Optional extra CA for building behind a TLS-intercepting proxy (ADR-003).
  # Empty by default; set EXTRA_CA_CERT=/path/to/ca.pem in infra/.env when needed.
  secrets: [extra_ca]

x-service: &service
  restart: unless-stopped
  networks: [marad-network]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Shared by every application service.
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Public keys only: no service but auth-service can sign an access token.
  JWT_PUBLIC_JWKS: ${JWT_PUBLIC_JWKS:?run make env to generate the access-token key pair}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
  DATABASE_URL: postgresql://${POSTGRES_USER:-marad}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-marad_db}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
  # Public gateway address used in locally stored image URLs (your Wi-Fi IP for a phone).
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api/v1}
  # Internal service map (used by the gateway and by service-to-service calls).
  AUTH_SERVICE_URL: http://auth-service:3001
  LISTINGS_SERVICE_URL: http://listings-service:3002
  SEARCH_SERVICE_URL: http://search-service:3003
  MESSAGING_SERVICE_URL: http://messaging-service:3004
  TRANSACTIONS_SERVICE_URL: http://transactions-service:3005
  IDENTITY_SERVICE_URL: http://identity-service:3006
  USERS_SERVICE_URL: http://users-service:3007
  MODERATION_SERVICE_URL: http://moderation-service:3008
  FRAUD_SERVICE_URL: http://fraud-service:8001
  PERSONALIZATION_SERVICE_URL: http://personalization-service:8002
  ELASTICSEARCH_NODE: http://elasticsearch:9200
  # Distributed tracing (OpenTelemetry → Jaeger). Remove to turn tracing off.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-depends-core: &depends-core
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:

  # ==========================================================================
  # Data stores
  # ==========================================================================

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-marad_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [marad-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks: [marad-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    # Official image, mirrored on Docker Hub (docker.elastic.co is not always reachable).
    image: elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=marad-search
      # search-service creates marad_listings with an explicit mapping; never let a
      # document write auto-create it with a dynamic one.
      - action.auto_create_index=-marad_listings,+*
      # Single-node dev cluster: do not turn indices read-only when the laptop disk is
      # nearly full (the default flood-stage watermark is 95% of the host disk).
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [marad-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      # The JVM can take over a minute to start on a laptop.
      start_period: 90s

  localstack:
    # KMS emulator for identity-service. No docker.sock mount: KMS does not need it, and
    # mounting the socket would hand root on the host to anything inside this container.
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      - SERVICES=kms
      - DEFAULT_REGION=me-south-1
    networks: [marad-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"kms\": \"\\(available\\|running\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Applies db/migrations once, before any service that uses Postgres.
  migrate:
    build:
      context: ../db
      <<: *build-secrets
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marad}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-marad_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [marad-network]
    restart: "no"

  # ==========================================================================
  # NestJS services
  # ==========================================================================

  api-gateway:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/node-workspace.Dockerfile
      args: { SERVICE: api-gateway }
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3000"
      OTEL_SERVICE_NAME: api-gateway
      # Bearer token Prometheus uses to scrape the gateway's public /metrics.
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in infra/.env}
    ports:
      # DEVICE_BIND=0.0.0.0 in infra/.env exposes it on the Wi-Fi network (testing on a phone).
      - "${DEVICE_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/node-workspace.Dockerfile
      args: { SERVICE: auth-service }
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3001"
      OTEL_SERVICE_NAME: auth-service
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?run make env to generate the access-token key pair}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in infra/.env}
      # Development only: OTP codes are logged instead of sent by SMS. Refused in production.
      OTP_MOCK_ENABLED: ${OTP_MOCK_ENABLED:-true}
      # Countries that may receive OTP SMS: every market with wave <= this (packages/markets).
      MARKETS_ACTIVE_WAVE: ${MARKETS_ACTIVE_WAVE:-1}
      OTP_ALLOWED_CALLING_CODES: ${OTP_ALLOWED_CALLING_CODES:-}
      TRUST_PROXY_HOPS: "1"
    depends_on: *depends-core

  listings-service:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/node-workspace.Dockerfile
      args: { SERVICE: listings-service }
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3002"
      # Currency of a new listing when the client sends none (until listings carry a country).
      DEFAULT_LISTING_CURRENCY: ${DEFAULT_LISTING_CURRENCY:-TRY}
      OTEL_SERVICE_NAME: listings-service
      S3_BUCKET: marad-listings-images
      S3_REGION: me-south-1
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      # Local image storage when S3 is not configured (STORAGE_PROVIDER != s3).
      - listings_media:/app/services/listings-service/tmp
    depends_on: *depends-core

  search-service:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/node-workspace.Dockerfile
      args: { SERVICE: search-service }
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3003"
      OTEL_SERVICE_NAME: search-service
    depends_on:
      <<: *depends-core
      elasticsearch:
        condition: service_healthy

  messaging-service:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/node-workspace.Dockerfile
      args: { SERVICE: messaging-service }
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3004"
      OTEL_SERVICE_NAME: messaging-service
    ports:
      # Socket.IO endpoint used directly by the web and mobile apps.
      - "${DEVICE_BIND:-127.0.0.1}:3004:3004"
    volumes:
      - messaging_media:/app/services/messaging-service/uploads
    depends_on: *depends-core

  transactions-service:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/node-workspace.Dockerfile
      args: { SERVICE: transactions-service }
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3005"
      OTEL_SERVICE_NAME: transactions-service
    depends_on: *depends-core

  identity-service:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/node-workspace.Dockerfile
      args: { SERVICE: identity-service }
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3006"
      OTEL_SERVICE_NAME: identity-service
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:?set DIDIT_WEBHOOK_SECRET in infra/.env}
      DIDIT_API_URL: https://api.didit.me
      AWS_REGION: me-south-1
      # LocalStack accepts any credentials; these are not real AWS keys.
      AWS_ACCESS_KEY_ID: localstack
      AWS_SECRET_ACCESS_KEY: localstack
      KMS_ENDPOINT: http://localstack:4566
    depends_on:
      <<: *depends-core
      localstack:
        condition: service_healthy

  users-service:
    <<: *service
    build:
      context: ../services/users-service
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3007"
      OTEL_SERVICE_NAME: users-service
    volumes:
      - users_media:/app/tmp
    depends_on: *depends-core

  moderation-service:
    <<: *service
    build:
      context: ../services/moderation-service
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "3008"
      OTEL_SERVICE_NAME: moderation-service
    depends_on: *depends-core

  # ==========================================================================
  # Python services
  # ==========================================================================

  fraud-service:
    <<: *service
    build:
      context: ../services/fraud-service
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "8001"
      OTEL_SERVICE_NAME: fraud-service
    depends_on: *depends-core

  personalization-service:
    <<: *service
    build:
      context: ../services/personalization-service
      <<: *build-secrets
    environment:
      <<: *app-env
      PORT: "8002"
      OTEL_SERVICE_NAME: personalization-service
    depends_on:
      <<: *depends-core
      elasticsearch:
        condition: service_healthy

  # ==========================================================================
  # Web app (Next.js)
  # ==========================================================================

  web:
    <<: *service
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      <<: *build-secrets
      args:
        # Inlined into the browser bundle: the addresses as the browser sees them.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:3004}
        NEXT_PUBLIC_GRAFANA_URL: http://localhost:3200
    ports:
      - "${DEVICE_BIND:-127.0.0.1}:3100:3100"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ==========================================================================
  # Monitoring
  # ==========================================================================

  jaeger:
    # Trace UI on http://localhost:16686; receives OTLP over HTTP on 4318 (internal only).
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    networks: [marad-network]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks: [marad-network]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      # 3100 is the web app's port.
      - "127.0.0.1:3200:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks: [marad-network]

networks:
  marad-network:
    name: marad-network

secrets:
  # Prometheus reads the gateway token as a file (it cannot expand env vars).
  metrics_token:
    environment: METRICS_TOKEN
  extra_ca:
    file: ${EXTRA_CA_CERT:-./docker/no-extra-ca.pem}

volumes:
  postgres_data:
  redis_data:
  es_data:
  listings_media:
  messaging_media:
  users_media:
  prometheus_data:
  grafana_data:
